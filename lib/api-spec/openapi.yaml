components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Settings:
      type: object
      required: [id, companyName, nif, currency, country]
      properties:
        id:
          type: integer
        companyName:
          type: string
        nif:
          type: string
        currency:
          type: string
        country:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        taxRate:
          type: number
        updatedAt:
          type: string

    SettingsUpdate:
      type: object
      properties:
        companyName:
          type: string
        nif:
          type: string
        currency:
          type: string
        country:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        logoUrl:
          type: string
        taxRate:
          type: number

