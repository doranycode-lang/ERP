name: Reconstituir ULTRACARDIO original no ERP
on:
  push:
    branches:
      - import/ultracardio-completo
    paths:
      - 'transfer/chunks/**'
      - 'transfer/manifest.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verificar integridade e reconstruir todos os ficheiros
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,pathlib,tarfile
          manifest=json.loads(pathlib.Path("transfer/manifest.json").read_text())
          chunks=manifest["parts"]
          assert chunks and manifest["files"] >= 600
          combined=bytearray()
          for part in chunks:
              file=pathlib.Path("transfer/chunks")/part["name"]
              data=file.read_bytes()
              assert hashlib.sha256(data).hexdigest()==part["sha256"],file
              combined.extend(data)
          binary=base64.b64decode(combined,validate=True)
          assert len(binary)==manifest["bytes"]
          assert hashlib.sha256(binary).hexdigest()==manifest["sha256"]
          counter=0
          with tarfile.open(fileobj=io.BytesIO(binary),mode="r:gz") as tar:
              for member in tar:
                  name=pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts or not member.isfile():
                      raise ValueError("Unexpected path/type: "+member.name)
                  file=pathlib.Path(*name.parts)
                  file.parent.mkdir(parents=True,exist_ok=True)
                  # Only overwrite the source tree's own paths. No deletion of unrelated files.
                  data=tar.extractfile(member).read()
                  file.write_bytes(data)
                  file.chmod(member.mode & 0o777)
                  counter+=1
          if counter!=manifest["files"]:
              raise ValueError("Unexpected file count")
          print("Restored:",counter,"files from",manifest["source_commit"],"sha256",manifest["sha256"])
          provenance=pathlib.Path("MIGRACAO_ULTRACARDIO.md")
          provenance.write_text(
            "# Migração integral do ULTRACARDIO para ERP\n\n"
            f"Repositório de origem: {manifest['source_repo']}\n\n"
            f"Commit de origem: `{manifest['source_commit']}`\n\n"
            f"Ficheiros originais recuperados: {counter}\n\n"
            f"SHA-256 do arquivo transportado: `{manifest['sha256']}`\n\n"
            "A aplicação web executável encontra-se em `apps/hospital-operacional/`. "
            "A facturação anterior e os demais módulos foram conservados no seus caminhos originais. "
            "Esta importação não publica nem certifica a aplicação para dados clínicos reais.\n"
          )
          PY
      - name: Testar a aplicação hospitalar real
        working-directory: apps/hospital-operacional
        run: |
          npm run check
          npm test
      - name: Gravar o projecto no branch ERP, sem os fragmentos temporários
        run: |
          rm -rf transfer/chunks transfer/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "import: restore full ULTRACARDIO original into ERP and verify tests" && git push origin HEAD:import/ultracardio-completo)
