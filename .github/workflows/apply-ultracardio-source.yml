name: Aplicar codigo ULTRACARDIO completo
on:
  push:
    branches: [import/ultracardio-completo]
    paths:
      - .github/workflows/apply-ultracardio-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Receber pacote temporario validado do repositório privado
        env:
          SNAPSHOT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-db68-8246-8868-cfb23ba4afbd/raw?se=2026-10-19T12%3A02%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=60e57b8f-301b-5d75-b7f3-a1323c08d8b2&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T08%3A53%3A00Z&ske=2026-10-20T08%3A53%3A00Z&sks=b&skv=2026-02-06&sig=16V%2BwT39aApFttDfvijPnEDyY3nTdFBLN6q0JaAdbg4%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$SNAPSHOT_URL" -o /tmp/ultracardio-source.zip
          unzip -p /tmp/ultracardio-source.zip ultracardio-main-source.tar.gz >/tmp/source.tar.gz
          test -s /tmp/source.tar.gz
          mkdir -p /tmp/ultracardio
          tar -xzpf /tmp/source.tar.gz -C /tmp/ultracardio
          test -f /tmp/ultracardio/apps/hospital-operacional/package.json
          test -f /tmp/ultracardio/modules/gestao-facturacao-produtos/versao-artifacts-2/IMPORT_MANIFEST.json
          test -f /tmp/ultracardio/imports/facturacao-produtos/artifacts-2.zip
          echo "Snapshot validado"
      - name: Preservar README antigo e copiar todos os ficheiros
        run: |
          set -euo pipefail
          mkdir -p docs
          cp README.md docs/README-ERP-ANTERIOR.md
          cp -a /tmp/ultracardio/. ./
          # GITHUB_TOKEN cannot add workflow files; import them with the authorized GitHub connector afterward.
          rm -f .github/workflows/hospital-operacional.yml .github/workflows/import_facturacao_produtos.yml
          cat > docs/TRANSFERENCIA-ULTRACARDIO-ERP.md <<'EOF'
          # Transferência da versão completa do ULTRACARDIO para ERP

          Origem: `doranycode-lang/ultracardio-erp` (`main`), commit `a18065dcb32acef35f1a8b925418e04670a32fb4`.

          Copiados 617 ficheiros originais, incluindo a aplicação web persistente
          em `apps/hospital-operacional/` e os 287 ficheiros importados de
          gestão/facturação em `modules/gestao-facturacao-produtos/versao-artifacts-2/`.
          Os nomes e caminhos originais foram preservados.
          O README antigo de ERP foi preservado em `docs/README-ERP-ANTERIOR.md`.

          Este commit não faz deploy nem altera produção. Facturação AGT não homologada.
          Não utilizar dados reais de pacientes até validar segurança e isolamento.
          EOF
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || (git commit -m "feat(erp): importar versão integral do ULTRACARDIO mantendo toda a estrutura" && git push origin HEAD:import/ultracardio-completo)
